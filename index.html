<style>
/* Layout: a phone frame centered on a quiet page, with a small side panel explaining what the demo does. Everything inside the phone is the app. */
:root{

  --display:"Noto Serif SC","Songti SC",serif; --body:"Noto Sans SC","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  --fs:18.75px; color-scheme:light;   /* base +25% (was 15px) */
  /* page backdrop: 宣纸底 + 祥云纹 + 淡墨晕(单一浅色主题) */
  --bg-art:radial-gradient(ellipse 70% 55% at 15% 0%,rgba(47,111,94,.10),transparent 60%),radial-gradient(ellipse 60% 50% at 100% 100%,rgba(183,137,58,.12),transparent 60%),var(--cloud); --frame:#c9b98a; --frame-shadow:0 0 0 1px rgba(183,137,58,.25),0 20px 60px rgba(60,45,20,.22);
  --cloud:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160' viewBox='0 0 160 160'><g fill='none' stroke='%238a7a4e' stroke-opacity='.16' stroke-width='1.2' stroke-linecap='round'><path d='M22 52c0-9 7-14 14-14s11 5 11 11c7 0 12 5 12 11s-5 11-12 11H34c-7 0-12-5-12-11z'/><path d='M38 50a5 5 0 1 0 10 0a5 5 0 1 0-10 0'/><path d='M46 49c3-4 9-4 12 0'/><path d='M94 118c0-9 7-14 14-14s11 5 11 11c7 0 12 5 12 11s-5 11-12 11h-13c-7 0-12-5-12-11z'/><path d='M110 116a5 5 0 1 0 10 0a5 5 0 1 0-10 0'/><path d='M118 115c3-4 9-4 12 0'/><path d='M104 30c6-8 18-8 24 0'/><path d='M110 36c3-4 9-4 12 0'/><path d='M24 124c6-8 18-8 24 0'/><path d='M30 130c3-4 9-4 12 0'/></g></svg>");
}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:var(--bg-art);background-attachment:fixed;color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:24px 40px;min-height:100vh}
/* 印章式角标 */
.seal{position:fixed;right:28px;bottom:28px;width:64px;height:64px;border:2px solid rgba(178,52,45,.55);border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:rgba(178,52,45,.75);font-size:15px;line-height:1.1;text-align:center;letter-spacing:.05em;writing-mode:vertical-rl;pointer-events:none;transform:rotate(-4deg)}
@media (max-width:860px){.seal{display:none!important}}
.stage{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:24px;align-items:start;justify-items:center}
@media (min-width:860px){.stage{grid-template-columns:minmax(0,1fr) 400px}}
.side{max-width:440px;font-size:17.5px;line-height:1.7;order:2}
@media (min-width:860px){.side{order:0;justify-self:end;padding-top:12px}}
.side h1{font-family:var(--display);font-size:30px;margin:0 0 6px}
.side p{margin:0 0 10px;color:var(--muted)}
.side ol{padding-left:1.2em;margin:0 0 12px}
.side li{margin-bottom:4px}
.side .tag{display:inline-block;font-size:13.5px;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted);margin-right:6px}
.side button{font:inherit;font-size:16px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;cursor:pointer;margin-right:6px}
.side button.on{border-color:var(--accent);color:var(--accent);font-weight:600}

/* phone */
.phone{width:min(390px,100%);height:min(800px,calc(100vh - 80px));min-height:600px;background:var(--app-bg);border:1px solid var(--frame);border-radius:40px;box-shadow:var(--frame-shadow);overflow:hidden;position:relative;display:flex;flex-direction:column;font-size:var(--fs)}
.phone[data-elder="1"]{--fs:23.4px}
/* on a real phone (narrow viewport) the app fills the screen: +25% type, no device frame */
@media (max-width:520px){
  body{padding-inline:0;padding-block:0}
  .stage{gap:0}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border:none;border-radius:0;box-shadow:none;--fs:23.4px}
  .phone[data-elder="1"]{--fs:28px}
  .side{padding:16px;order:2}
  .seal{display:none!important}
}
.phone[data-lang="en"]{--display:"Georgia","Times New Roman",serif; --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;color:var(--muted);flex:none}
.topbar{display:flex;align-items:center;gap:10px;padding:4px 16px 10px;flex:none;border-bottom:1px solid var(--line);background:var(--app-bg)}
.member{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:.9em}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:13px}
.topbar .title{flex:1;font-weight:700;font-size:1.05em}
.back{background:none;border:none;color:var(--accent);font:inherit;font-size:1em;cursor:pointer;padding:4px 6px}
.lang{font:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:2px 8px;cursor:pointer}
.content{flex:1;overflow-y:auto;padding:14px 16px 24px;min-height:0;scrollbar-width:thin}
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 0 14px}
.tabbar button{background:none;border:none;font:inherit;font-size:.75em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:var(--accent);font-weight:700}

/* components */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:1em}
.card .k{font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.card.soft{background:var(--accent-soft);border-color:transparent}
.card.warn{background:var(--warn-soft);border-color:transparent}
.card.crit{background:var(--crit-soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-size:.95em;padding:10px 16px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;font-weight:600}
.btn.sec{background:var(--surface);color:var(--accent)}
.btn.ghost{background:none;border-color:var(--line);color:var(--fg)}
.btn.sm{padding:6px 12px;font-size:.85em;border-radius:10px}
.btn.full{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:.85em}
.pill{display:inline-block;font-size:.72em;padding:1px 8px;border-radius:999px;border:1px solid currentColor;line-height:1.7;white-space:nowrap}
.pill.ok{color:var(--accent);background:var(--accent-soft)}
.pill.wn{color:var(--warn);background:var(--warn-soft)}
.pill.cr{color:var(--crit);background:var(--crit-soft)}
.pill.gd{color:var(--gold)}
.src{display:inline-block;font-size:.72em;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px;cursor:pointer}
h2.sec{font-family:var(--display);font-size:1.15em;margin:6px 0 10px}
.list{margin:0;padding-left:1.2em}
.list li{margin-bottom:4px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{font:inherit;font-size:.9em;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.opt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.likert button{font:inherit;font-size:.72em;padding:8px 2px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.likert button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.bubble{max-width:85%;padding:10px 12px;border-radius:14px;margin-bottom:8px;line-height:1.5;font-size:.95em}
.bubble.ai{background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.bubble.me{background:var(--accent);color:var(--accent-ink);margin-left:auto;border-top-right-radius:4px}
.inputrow{display:flex;gap:6px;margin-top:8px;position:sticky;bottom:0;background:var(--app-bg);padding-top:6px}
.inputrow input{flex:1;font:inherit;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);min-width:0}
.tabs2{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.tabs2 button{font:inherit;font-size:.85em;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.tabs2 button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95em}
.kv:last-child{border-bottom:none}
.toggle{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;border:none;cursor:pointer;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on{background:var(--accent)}.toggle.on::after{left:21px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{font:inherit;font-size:.85em;padding:4px 12px;border:none;background:var(--surface);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.bar{display:flex;align-items:center;gap:8px;font-size:.85em;margin-bottom:6px}
.bar i{display:block;height:10px;background:var(--accent);border-radius:5px}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--app-bg);width:100%;max-height:92%;border-radius:24px 24px 0 0;display:flex;flex-direction:column;overflow:hidden;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet>div{animation:none}}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;flex:none}
.sheet .hd b{font-size:1.05em}
.sheet .bd{overflow-y:auto;padding:4px 16px 24px;min-height:0;flex:1}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.85em;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:85%;text-align:center}
.toast.show{opacity:1}
.emerg{position:absolute;inset:0;background:var(--crit-soft);z-index:8;padding:40px 24px;display:flex;flex-direction:column;gap:14px}
.emerg h2{font-family:var(--display);color:var(--crit);margin:0}
.emerg .num{font-size:2.2em;font-weight:700;font-family:var(--display)}
.guide{border:1px dashed var(--accent);background:var(--accent-soft)}
.ribbon{font-size:.72em;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:2px 8px;display:inline-block;margin-bottom:6px}
svg.radar text{font-size:13px;fill:var(--fg)}
.check{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.btn{white-space:nowrap}
.done{color:var(--accent);font-weight:600}
.body{width:100%;max-width:200px;margin:0 auto;display:block}
.disclaimer{font-size:.75em;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:12px}
</style>
</head>

 ailments in summer starts now: no ice, no air-con blasting, belly covered, ten minutes of noon sun on the back."},"yinxu":{"zh":"夏至阴气初生,正是滋阴时,多喝温水,晚餐银耳、梨、鸭肉任选。","en":"Yin is born at the solstice — nourish it: warm water, and white fungus, pear or duck at dinner."},"tanshi":{"zh":"大热天也别放纵冰饮,会加重痰湿;出微汗、吃冬瓜最好。","en":"Even in heat, iced drinks worsen phlegm-damp: a light sweat and winter melon instead."},"shire":{"zh":"夏至湿热体质最难受,绿豆汤、苦瓜清热,别喝酒别熬夜。","en":"The solstice is hardest on damp-heat: mung-bean soup and bitter melon; no alcohol, no late nights."},"xueyu":{"zh":"天热血行畅,正好多活动;别久坐空调房让寒凝血脉。","en":"Heat moves the blood — a good time to be active; don't let air-conditioning chill and stall it."},"qiyu":{"zh":"心静自然凉,午后听音乐、泡杯玫瑰花茶,别把烦躁憋着。","en":"A calm mind cools the body: music and rose tea in the afternoon; let irritation out, not in."},"tebing":{"zh":"紫外线最强,防晒做足;汗多勤擦,别让汗液刺激皮肤。","en":"Peak UV: sunscreen on; dry off sweat often so it doesn't irritate the skin."}},"xiaoshu":{"pinghe":{"zh":"小暑湿热交蒸,少量多餐、清淡易消化,荷叶茶解暑。","en":"Minor Heat steams: smaller, lighter meals and lotus-leaf tea to cool down."},"qixu":{"zh":"暑湿让气虚者胃口差、乏力,今天少吃多餐,别省午休。","en":"Summer damp dulls appetite and energy: small frequent meals today, and keep the nap."},"yangxu":{"zh":"外热内寒最常见于阳虚者,冰饮一口都别碰,喝温绿豆汤。","en":"Heat outside, cold inside — typical for yang deficiency: no iced drinks at all; warm mung-bean soup."},"yinxu":{"zh":"小暑汗多伤阴,多喝水,今天吃点酸甜:乌梅汤、西红柿。","en":"Heavy sweating taxes yin: drink more; something sour-sweet today — smoked-plum drink, tomato."},"tanshi":{"zh":"湿热困脾最重的时候,饮食务必清淡,今天不碰甜食。","en":"Peak damp burden on the spleen: strictly light meals, no sweets today."},"shire":{"zh":"小暑湿热体质易长痘口苦,薏米冬瓜汤、少辣少油、早睡。","en":"Minor Heat brings acne and bitter taste: Job's tears and winter-melon soup, little chili or oil, early bed."},"xueyu":{"zh":"闷热别久卧,傍晚凉快时出去走走,活动肩背。","en":"Don't lie about in the heat: walk at dusk and loosen the shoulders."},"qiyu":{"zh":"暑热令人烦躁,今天给自己一段安静时间,深呼吸、听音乐。","en":"Heat frays patience   const dayNum=ms=>{ const x=new Date(ms); return Math.floor((Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()))/86400000); };

/* ---------- scoring (ZYYXH/T 157-2009 + early stop) ---------- */
// conclusion codes: "no" | "yes" | "tend" | "pending-balanced" ; confidence: "confirmed" | "prelim" | "open"
function scaleState(sc, answers){
  const n = sc.items.length; let sum=0, k=0, ansCount=0;
  for(const [id,rev] of sc.items){ const v=answers[id]; if(v==null){k++;continue} ansCount++; sum += rev? 6-v : v; }
  const t = (raw)=> (raw-n)/(n*4)*100;
  const tmin=t(sum+k), tmax=t(sum+k*5);
  const est = ansCount? t(sum + k*(sum/ansCount)) : t(sum+k);
  let concl=null;
  if(sc.type==="balanced"){ if(tmax<60) concl="no"; else if(k===0) concl="pending-balanced"; }
  else { if(tmax<30) concl="no"; else if(tmin>=40) concl="yes"; else if(tmin>=30&&tmax<40) concl="tend"; }
  const conf = concl? "confirmed" : (tmax-tmin<=25? "prelim":"open");
  return {code:sc.code,zh:sc.zh,en:sc.en,short:sc.short,n,k,tmin,tmax,est,concl,conf,remaining:k};
}
const CONF = {confirmed:{zh:"已确认",en:"Confirmed",cls:"ok"},prelim:{zh:"初步",en:"Preliminary",cls:"wn"},open:{zh:"待定",en:"Undetermined",cls:"cr"}};
const CONCL = {no:{zh:"否",en:"No"},yes:{zh:"是",en:"Yes"},tend:{zh:"倾向是",en:"Tendency"},"basically":{zh:"基本是",en:"Mostly"}};
function assess(m){
  const st = SCALES.map(sc=>scaleState(sc,m.answers));
  const biased = st.filter(s=>s.code!=="pinghe");
  const ph = st[0];
  const allB = biased.every(s=>s.concl);
  let phLabel = ph.concl;
  if(ph.concl==="pending-balanced" || (ph.concl!=="no" && allB && ph.k===0)){
    if(ph.est>=60 && biased.every(s=>s.tmax<30)) phLabel="yes";
    else if(ph.est>=60 && biased.every(s=>s.tmax<40)) phLabel="basically";
    else if(ph.k===0) phLabel="no";
  }
  const yes = biased.filter(s=>s.concl==="yes"||(!s.concl&&s.est>=40)).sort((a,b)=>b.est-a.est);
  const tend = biased.filter(s=>s.concl==="tend"||(!s.concl&&s.est>=30&&s.est<40)).sort((a,b)=>b.est-a.est);
  let primary, primaryConf;
  const sorted=[...biased].sort((a,b)=>b.est-a.est); const gap = sorted.length>1? sorted[0].est-sorted[1].est : 99;
  const provisionalConf = ()=> gap>=15 ? "prelim" : "open";
  if(yes.length){ primary=yes[0]; primaryConf= yes[0].concl==="yes" ? "confirmed" : provisionalConf(); }
  else if(phLabel==="yes"||phLabel==="basically"||(ph.est>=60&&!biased.some(s=>s.est>=30))){ primary=ph; primaryConf=ph.k===0?"confirmed":ph.conf; }
  else if(tend.length){ primary=tend[0]; primaryConf= tend[0].concl==="tend" ? "confirmed" : provisionalConf(); }
  else { primary = sorted[0]; primaryConf="open"; }
  // distinct unanswered items across unsettled scales (shared items counted once)
  const pend=new Set(); SCALES.forEach((sc,i)=>{ const s=st[i]; if(s.concl && s.concl!=="pending-balanced") return; sc.items.forEach(([id])=>{ if(m.answers[id]==null) pend.add(id); }); }); const remaining=pend.size;
  const formal = st.every(s=>s.concl && s.concl!=="pending-balanced") || Object.keys(m.answers).length>=60;
  return {st, primary, primaryConf, secondary: yes.slice(1), tendencies: tend, remaining, formal, phLabel};
}
function nextItems(m, limit){
  const st = SCALES.map(sc=>({sc, s:scaleState(sc,m.answers)})).filter(x=>!x.s.concl||x.s.concl==="pending-balanced");
  const out=[]; let progress=true;
  while(out.length<limit && progress){
    progress=false;
    for(const {sc} of st){
      const next = sc.items.map(i=>i[0]).find(id=> m.answers[id]==null && !out.includes(id));
      if(next){ out.push(next); progress=true; if(out.length>=limit) break; }
    }
  }
  return out;
}
function setAnswer(m,id,v){ m.answers[id]=v; const a=assess(m); if(a.formal && !m.formal){ m.formal=true; } save(); }

/* ---------- today's 3 actionable picks (item-based) ---------- */
// Candidates are the knowledge-layer items referenced by the constitution's plan. Scored by season tag
// (derived from the 24 terms' diet focus / acupoint seasons), goal tags, actionability, recent repetition
// and yesterday's check-in. Deterministic per day. Each pick carries its item id and source.
function pickCandidates(code){ const P=PLANS[code]||PLANS.pinghe; return [...P.favor,...P.avoid,P.routine,P.movement,P.recipe,...P.acupoints].map(id=>IT_(id)); }
function dailyPicks(m){
  m.picksLog=m.picksLog||{};
  const code=m.plan.code, T=termAt();
  const dayKeys=Object.keys(m.checkins).concat(Object.keys(m.picksLog)).filter((v,i,a)=>a.indexOf(v)===i).sort();
  const prevDays=dayKeys.filter(d=>d<S.day).slice(-3);
  const recent=new Set(prevDays.flatMap(d=>m.picksLog[d]||[]));
  const last=prevDays.length? (m.checkins[prevDays[prevDays.length-1]]||{}) : {};
  const lastDiet=last.diet, lastAcu=typeof last.acu==="string"?last.acu:null, lastSleep=last.sleep, lastMove=last.move, lastMood=last.mood;
  const flags=new Set([m.pregnancy?"pregnancy":null, m.alcoholFree?"alcohol":null].filter(Boolean));
  const cands=pickCandidates(code).filter(it=>!it.contraindications.some(c=>flags.has(c)));
  const scored=cands.map(it=>{
    let score=0; const why=[]; const t=it.type;
    if(it.seasons.includes(T.season)){ score+= (t==="diet_favor"||t==="diet_avoid"||t==="recipe")?2:1; why.push(tt(`${T.name}·${{diet_favor:"宜食",diet_avoid:"宜食",recipe:"食疗",acupoint:"穴位",routine:"作息",movement:"运动"}[t]}`,`${T.name} ${ {diet_favor:"food",diet_avoid:"food",recipe:"recipe",acupoint:"point",routine:"routine",movement:"movement"}[t] }`)); }
    for(const g of m.plan.goals||[]){ const r=GOAL_RULES[g]; const hit=it.goals.includes(g)||(r&&(r.types.includes(t)||(t==="acupoint"&&r.acupoints.includes(it.code)))); if(hit){ score+=2; why.push(tt(`${GL(g)}目标`,`${GL(g)} goal`)); } }
    if(t==="diet_avoid"||t==="acupoint"||t==="routine") score+=1;
    if(recent.has(it.id)) score-=1;
    if(lastDiet==="否"){ if(t==="diet_avoid"){ score+=1; why.unshift(tt("昨日饮食未遵循,先从少吃一样开始","yesterday's diet missed — start by cutting one thing")); } if(t==="diet_favor") score-=1; }
    if(lastAcu && t==="acupoint"){ if(it.code===lastAcu) score-=2; else { score+=1; why.unshift(tt("昨天按过另一穴,今天换一个","rotate from yesterday's point")); } }
    if(lastSleep!=null && lastSleep<6 && t==="routine"){ score+=2; why.unshift(tt("昨晚睡不足 6 小时","under 6 h sleep last night")); }
    if(lastMove==="0" && t==="movement"){ score+=1; why.unshift(tt("昨天没动,今天动一动","no movement yesterday")); }
    if(lastMood!=null && lastMood<=2 && (t==="recipe"||(t==="acupoint"&&["LR3","CV17"].includes(it.code)))){ score+=2; why.unshift(tt("昨日情绪偏低","low mood yesterday")); }
    return {it,score,why};
  }).sort((a,b)=>b.score-a.score||cands.indexOf(a.it)-cands.indexOf(b.it));
  const fam=t=>t.startsWith("diet")?"diet":t; const picks=[]; const fams=new Set();
  // one acupoint every day (the product's differentiator): take the best-scored acupoint first, then fill the other two sections
  const bestAcu=scored.find(c=>c.it.type==="acupoint"); if(bestAcu){ picks.push(bestAcu); fams.add("acupoint"); }
  for(const c of scored){ if(fams.has(fam(c.it.type))) continue; picks.push(c); fams.add(fam(c.it.type)); if(picks.length===3) break; }
  picks.sort((x,y)=>y.score-x.score);
  for(const c of scored){ if(picks.length===3) break; if(!picks.includes(c)) picks.push(c); }
  m.picksLog[S.day]=picks.map(p=>p.it.id); save();
  return picks.map(p=>({id:p.it.id,text:pickText(p.it),why:p.why.length?p.why.slice(0,2).join(" · "):tt("常规","routine"),src:SRC_LABEL(p.it)}));
}
function pickText(it){

  if(it.type==="diet_avoid") return `${tt("忌","Avoid")}: ${itName(it)}`;
  if(it.type==="recipe") return `${tt("食疗","Recipe")}: ${itName(it)}`;
  if(it.type==="acupoint") return `${itName(it)} — ${it.detail[L].how}`;

}

function radar(a){
  const cx=150,cy=130,R=95,n=9; const pt=(i,r)=>{const ang=-Math.PI/2+i*2*Math.PI/n; return [cx+r*Math.cos(ang),cy+r*Math.sin(ang)]};
  let g=""; for(const f of [.25,.5,.75,1]) g+=`<polygon points="${a.st.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line)"/>`;
  a.st.forEach((s,i)=>{ const [x,y]=pt(i,R+18); g+=`<line x1="${cx}" y1="${cy}" x2="${pt(i,R)[0]}" y2="${pt(i,R)[1]}" stroke="var(--line)"/><text x="${x}" y="${y+4}" text-anchor="middle" font-weight="${s.code===a.primary.code?700:400}">${esc(pick(s.short))}</text>`; });
  const settled = a.st.every(s=>s.concl);
  if(!settled){ const band=a.st.map((s,i)=>pt(i,R*Math.min(100,Math.max(0,s.tmax))/100).join(",")).join(" "); const inner=a.st.map((s,i)=>pt(i,R*Math.min(100,Math.max(0,s.tmin))/100).join(",")).join(" "); g+=`<polygon points="${band}" fill="var(--accent)" opacity=".12"/><polygon points="${inner}" fill="none" stroke="var(--accent)" stroke-dasharray="3 3" opacity=".6"/>`; }
  g+=`<polygon points="${a.st.map((s,i)=>pt(i,R*Math.min(100,Math.max(0,s.est))/100).join(",")).join(" ")}" fill="var(--accent)" opacity=".35" stroke="var(--accent)" stroke-width="2"/>`;
  return `<svg class="radar" viewBox="0 0 300 265" style="width:100%;max-width:300px;display:block;margin:0 auto">${g}</svg>${settled?"":`<div class="small muted" style="text-align:center">${tt("阴影带 = 可能区间;实线 = 当前估计","Shaded band = possible range; solid = current estimate")}</div>`}`;
}

/* --- acupressure countdown --- */
const TIMER={total:120,left:120,running:false,handle:null,point:null,side:1};
function timerBlock(a){
  if(TIMER.point!==a.m){ stopTimer(); TIMER.point=a.m; TIMER.left=TIMER.total; TIMER.side=1; }
  const pct=1-TIMER.left/TIMER.total, r=34, C=2*Math.PI*r;
  return `<div class="card soft" style="text-align:center;margin:12px 0 0"><div class="k">${tt(`按压计时 · 第 ${TIMER.side} 侧`,`Acupressure timer · side ${TIMER.side}`)}</div>
  <svg viewBox="0 0 80 80" style="width:96px;height:96px;display:block;margin:4px auto"><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="tRing" cx="40" cy="40" r="${r}" fill="none" stroke="var(--accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 40 40)" style="transition:stroke-dashoffset .3s"/><text id="tText" x="40" y="46" text-anchor="middle" style="font-size:18px;font-weight:700;fill:var(--fg);font-variant-numeric:tabular-nums">${fmtT(TIMER.left)}</text></svg>
  <div class="small muted" id="tHint" style="margin-bottom:8px">${TIMER.running?tt("拇指按揉,力度以酸胀为度","Knead with the thumb until it aches slightly"):TIMER.left===TIMER.total?tt("每侧 2 分钟,做完提示换另一侧","2 minutes per side; you'll be prompted to switch"):tt("已暂停","Paused")}</div>
  <div class="row" style="justify-content:center"><button class="btn sm" data-act="tToggle">${TIMER.running?tt("⏸ 暂停","⏸ Pause"):TIMER.left===TIMER.total?tt("▶ 开始","▶ Start"):tt("▶ 继续","▶ Resume")}</button><button class="btn ghost sm" data-act="tReset" ${TIMER.left===TIMER.total&&!TIMER.running?"disabled":""}>${tt("重置","Reset")}</button></div></div>`;
}
function fmtT(s){ return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function stopTimer(){ if(TIMER.handle){ clearInterval(TIMER.handle); TIMER.handle=null; } TIMER.running=false; }
function tickTimer(){
  TIMER.left=Math.max(0,TIMER.left-1);
  const C=2*Math.PI*34, ring=document.getElementById("tRing"), txt=document.getElementById("tText");
  if(ring) ring.setAttribute("stroke-dashoffset", C*(TIMER.left/TIMER.total));
  if(txt) txt.textContent=fmtT(TIMER.left);
  if(TIMER.left===0){ stopTimer(); if(TIMER.side===1){ TIMER.side=2; TIMER.left=TIMER.total; toast(tt("第 1 侧完成,换另一侧","Side 1 done — switch sides")); } else { TIMER.side=1; TIMER.left=TIMER.total; toast(tt("两侧完成 ✓ 已记录到今日","Both sides done ✓ logged for today")); const c=M().checkins[S.day]||(M().checkins[S.day]={}); c.acu=TIMER.point; save(); } render(); }

  const id=ids[P.i];
  const settledNote = sheet.kind!=="assess"? `<div class="small muted" style="margin-bottom:6px">${tt("剩余待判定题:约","Remaining undetermined: about")} ${assess(m).remaining}</div>`:"";
  return `${settledNote}<div class="prog"><i style="width:${P.i/total*100}%"></i></div><div class="small muted">${tt(`第 ${P.i+1} / ${total} 题 · 近一年来`,`Question ${P.i+1} of ${total} · over the past year`)}</div><div class="card" style="margin-top:8px"><h3 style="font-size:1.1em;line-height:1.5">${esc(IT(id))}</h3><div class="likert">${LK().map((l,i)=>`<button class="${m.answers[id]===i+1?"on":""}" data-act="ans" data-id="${id}" data-v="${i+1}">${l}</button>`).join("")}</div></div><div class="row" style="justify-content:space-between"><button class="btn ghost sm" data-act="prev" ${P.i===0?"disabled":""}>${tt("上一题","Previous")}</button>${sheet.kind==="assess"?`<button class="btn ghost sm" data-act="toChat">${tt("换成对话","Switch to chat")}</button>`:''}</div>`;
}
function finishBody(){
  const m=M(); const a=assess(m);
  if(sheet.kind==="assess") m.screenerDone=true;
  save();
  const settled = a.st.filter(s=>s.concl&&s.concl!=="pending-balanced").length;
  return `<div class="card soft" style="text-align:center"><div class="k">${m.formal?tt("正式结果","Formal result"):tt("初步判断","Preliminary result")}</div><div style="font-family:var(--display);font-size:1.5em;font-weight:700">${esc(sn(a.primary))}</div>${confPill(a.primaryConf)}<p class="small" style="margin:8px 0 0">${m.formal?tt("所有体质已判定,正式报告已生成。","All nine types determined; your formal report is ready."):tt(`已判定 ${settled}/9 种体质,再答约 <b>${a.remaining}</b> 题可确认。`,`${settled} of 9 types determined; about <b>${a.remaining}</b> more questions to confirm.`)}</p></div><div class="row"><button class="btn full" data-act="toReport">${m.formal?tt("查看正式报告","View formal report"):tt("查看初步报告","View preliminary report")}</button></div>${!m.formal&&sheet.kind!=="oneShot"?`<div class="row" style="margin-top:8px"><button class="btn ghost full" data-act="continueAll">${tt("继续答完剩余题目","Continue with the rest")}</button></div>`:''}`;
}
/* chat assessment */
function chatAssessBody(){
  const m=M(); const P=sheet.params;
  if(!P.log){ P.log=[{ai:true,t:tt("你好!我来帮你了解自己的体质。可以直接告诉我你最近身体上最明显的感觉,比如怕不怕冷、容易不容易累;也可以直接回答我的问题。","Hi! I'll help you learn your constitution. Tell me the most noticeable things about how your body feels lately — whether you run cold, tire easily — or just answer my questions.")}]; P.pending=null; }
  if(!P.ids) P.ids=SCREENER;
  const remainingIds = P.ids.filter(id=>m.answers[id]==null);
  if(!P.pending && remainingIds.length){ P.pending=remainingIds[0]; P.log.push({ai:true,q:P.pending}); }
  if(!remainingIds.length && !P.doneMsg){ P.doneMsg=true; P.log.push({ai:true,t:tt("初探完成。下面是你的初步判断。","Screener complete. Here is your preliminary result.")}); }
  const done = !remainingIds.length;
  const total=P.ids.length, answered=P.ids.filter(id=>m.answers[id]!=null).length;
  let html=`<div class="prog"><i style="width:${answered/total*100}%"></i></div><div class="small muted">${answered} / ${total} · ${tt("可自由描述,一句话常能回答好几题","Describe freely — one sentence often answers several questions")}</div><div style="margin-top:8px">${P.log.map(b=>`<div class="bubble ${b.ai?"ai":"me"}">${esc(b.q?IT(b.q):b.t)}${b.map?`<div class="small" style="opacity:.75;margin-top:4px">${esc(b.map)}</div>`:""}</div>`).join("")}</div>`;
  if(done){ html+=finishBody(); }
  else html+=`<div class="opts">${LK().map((l,i)=>`<button class="opt" data-act="chatAns" data-v="${i+1}">${l}</button>`).join("")}</div><div class="inputrow"><input id="chatIn" placeholder="${tt("或者直接描述,例如:我特别怕冷,手脚老凉","Or just describe, e.g. I'm always cold, hands and feet freezing")}"><button class="btn" data-act="chatSend">${tt("发送","Send")}</button></div><div class="row" style="margin-top:6px"><button class="btn ghost sm" data-act="toForm">${tt("换成问卷","Switch to form")}</button></div>`;
  return html;
}
function mapText(text){ const hits=[]; for(const [re,pairs] of PHRASES){ if(re.test(text)) for(const p of pairs) if(!hits.find(h=>h[0]===p[0])) hits.push(p); } return hits; }
const itemGist = id => EN()? ITEMS_EN[id].replace(/^(Do you |Are you |Are your |Is your |Does your |Do your |Have you )/,"").replace(/\?$/,"") : ITEMS_ZH[id].replace(/您|吗\?/g,"");

/* Q&A */
function askBody(){
  const P=sheet.params; if(!P.log){ P.log=[{ai:true,t:P.ctx?tt(`关于「${P.ctx}」,想了解什么?`,`What would you like to know about "${P.ctx}"?`):tt("我可以回答体质、食材、穴位、节气相关的养生问题。涉及疾病和用药的问题,我会帮你转给医生。","I can answer wellness questions about constitution, foods, acupoints and seasons. For anything about illness or medication, I'll refer you to your doctor.")}]; }
  let html=`<div>${P.log.map(b=>b.card==="referral"?referralCard(b):`<div class="bubble ${b.ai?"ai":"me"}">${esc(b.t)}${b.src?`<div style="margin-top:6px"><span class="src">${esc(b.src)}</span></div>`:""}</div>`).join("")}</div>`;
  const chips = P.ctx? (EN()?["Is this right for me?","Safe in pregnancy?","Best time of day?"]:["这个适合我吗?","孕期能用吗?","什么时候做最好?"]) : (EN()?[`What to eat at ${TERMNAME()}?`,"Can Yang deficiency drink coffee?","Where is Zusanli (ST36)?"]:[`${TERMNAME()}该怎么吃?`,"阳虚体质能喝咖啡吗?","足三里在哪里?"]);
  if(!P.log.some(b=>b.card==="referral"&&!b.resolved)) html+=`<div class="opts">${chips.map(q=>`<button class="opt" data-act="askQ" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`;
  html+=`<div class="inputrow"><input id="askIn" placeholder="${tt("输入问题…","Type a question…")}"><button class="btn" data-act="askSend">${tt("发送","Send")}</button></div>`;
  return html;
}
function referralCard(b){ return `<div class="card warn" style="max-width:92%"><div class="k">${tt("需要医生评估","Needs a doctor")}</div><p style="margin:0 0 8px">${tt("这个问题涉及具体病情和用药,超出了养生建议的范围。我可以帮你把症状记下来,带给你的医生。","This involves a specific condition and medication, which is beyond wellness guidance. I can note your symptoms to bring to your doctor.")}</p>${b.resolved?`<div class="small muted">${b.resolved==="record"?tt("已记录并转到诊所页","Recorded; opened clinic page"):tt("已选择了解一般养生知识","Chose general wellness instead")}</div>`:`<div class="row"><button class="btn sm" data-act="refRecord" data-s="${esc(b.symptom)}">${tt("记录症状并联系诊所","Note symptoms & contact clinic")}</button><button class="btn ghost sm" data-act="refGeneral">${tt("了解一般养生知识","General wellness instead")}</button></div>`}</div>`; }
function classify(t){
  if(/胸痛|呼吸困难|喘不过气|自杀|不想活|大出血|晕倒|昏迷|chest pain|can'?t breathe|trouble breathing|suicid|kill myself|end my life|heavy bleeding|passed out|fainted|unconscious/i.test(t)) return "emergency";
  if(/血压|血糖|糖尿病|吃什么药|中药|开方|处方|停药|降压|癌|肿瘤|发烧|发热|疼了.*天|确诊|是不是.*病|blood pressure|blood sugar|diabet|what (herb|medicine|drug)|prescri|stop (taking|my)|cancer|tumou?r|fever|diagnos|do i have/i.test(t)) return "medical";
  if(/天气|股票|电影|weather|stock|movie/i.test(t)) return "off";
  return "wellness";
}
function answerWellness(q){
  const m=M(); const code=m.plan?m.plan.code:(m.screenerDone?assess(m).primary.code:null); const z=code?sn(SC(code)):"";
  if(/节气|霜降|寒露|立冬|小雪|大雪|冬至|小寒|大寒|立春|雨水|惊蛰|春分|清明|谷雨|立夏|小满|芒种|夏至|小暑|大暑|立秋|处暑|白露|秋分|solar term|season|frost|dew|spring|summer|autumn|fall|winter|solstice|equinox/i.test(q)){ const T=termAt(); return {t:tt(`${T.name}是${{spring:"春",summer:"夏",autumn:"秋",winter:"冬"}[T.season]}季第 ${((T.index-1)%6+1)} 个节气,养生原则是“${T.def.p.zh}”。${T.def.tip.zh}`,`${T.name} is the ${ordinal(((T.index-1)%6+1))} term of ${T.season}; the principle is ${T.def.p.en.toLowerCase()}. ${T.def.tip.en}`)+(code?tt(` 你是${z},${CT(code).diet.y[0]}尤其适合。`,` For ${z}, ${CT(code).diet.y[0].toLowerCase()} suits you especially well.`):""),src:tt("《中医养生学》· 节气养生","TCM Health Preservation · seasonal care")}; }
  if(/咖啡|茶|coffee|tea/i.test(q)) return {t:tt("咖啡性温而走窜,少量可以提神,但阳虚体质本身阳气不足,靠咖啡提神会越喝越乏。建议上午一杯、不空腹、不加冰;下午改成姜枣茶或桂圆红枣茶。","Coffee is warm and dispersing; a little lifts you, but with yang deficiency relying on it leaves you more drained. One cup in the morning, not on an empty stomach, never iced; in the afternoon switch to ginger-date or longan-date tea."),src:tt("《中医食疗学》· 饮品宜忌","TCM Dietetics · beverages")};
  if(/足三里|穴位|在哪|zusanli|st36|acupoint|where is/i.test(q)) return {t:tt("足三里在外膝眼(膝盖外侧凹陷)直下 3 寸,约四横指宽,胫骨外侧一横指处。按下去有明显酸胀感就对了。拇指按揉 2–3 分钟,早晚各一次,是最常用的健脾强壮穴。","Zusanli (ST36) is 3 cun — about four finger-widths — below the outer knee hollow, one finger-width lateral to the shin bone. A clear ache on pressing means you've found it. Knead with the thumb 2–3 minutes, morning and evening; it's the classic strengthening point."),src:tt("《经络腧穴学》ST36","Meridians & Acupoints · ST36")};
  if(/适合我|right for me|suit me|good for me/i.test(q)) return {t:code?tt(`这项建议是按你的${z}生成的,整体适合。食疗方请按食材级配方,不加药材剂量;如果有已知过敏,先避开相应食材。`,`This was generated for your ${z} type, so overall yes. Treat recipes as food-level, without medicinal doses, and skip any ingredient you're allergic to.`):tt("先做一次体质初探,我才能告诉你是否适合。","Take the quick screener first and I can tell you."),src:tt("方案依据:体质 × 节气","Basis: constitution × season")};
  if(/孕期|怀孕|哺乳|pregnan|nursing|breastfeed/i.test(q)) return {t:tt("孕期和哺乳期的饮食和穴位有特殊禁忌(例如三阴交、合谷、腹部穴位应避免按压;薏米、山楂、玫瑰等食材需慎用)。请在基础信息中勾选孕哺期,方案会自动过滤;具体情况仍建议咨询医生。","Pregnancy and nursing carry specific cautions: avoid pressing SP6, LI4 and abdominal points; use Job's tears, hawthorn and rose with care. Tick pregnancy/nursing in your profile and the plan filters automatically — and do check with your doctor."),src:tt("《中医妇科学》· 妊娠禁忌","TCM Gynecology · pregnancy cautions")};
  if(/什么时候|时辰|when|best time|time of day/i.test(q)) return {t:tt("穴位按压一般早晚各一次;安神类(如三阴交、涌泉)放在睡前;健脾类(如足三里)饭后一小时。按子午流注,21–23 点三焦经当令,是收敛入睡的好时段。","Acupressure is usually morning and evening; calming points (SP6, KI1) before bed, digestive points (ST36) an hour after meals. By the organ clock, 9–11 pm is the Triple Burner hour — a good window to wind down."),src:tt("《针灸学》· 子午流注","Acupuncture · organ clock")};
  return {t:tt("这是一个养生范围内的问题。","That's within wellness scope. ")+(code?tt(`以你的${z}来说,${CT(code).sum}`,`For your ${z}: ${CT(code).sum}`):tt("建议先完成体质初探,我能给出更有针对性的回答。","Take the quick screener and I can be more specific."))+tt(" 如果有具体症状或在用药,请点「联系我的诊所」。"," If you have specific symptoms or take medication, use “My clinic”."),src:tt("中医基础理论","TCM foundations")};
}

/* ---------- events ---------- */
function bind(root){
  root.querySelectorAll("[data-act]").forEach(el=>{ el.onclick=(e)=>{ e.stopPropagation(); act(el.dataset.act, el.dataset, el); }; });
  root.querySelectorAll("[data-sec]").forEach(el=>el.onclick=()=>{ M().plan.sec=el.dataset.sec; save(); render(); });
  root.querySelectorAll("[data-ck]").forEach(el=>el.onclick=()=>{ const c=M().checkins[S.day]; c[el.dataset.ck]= el.dataset.ck==="mood"? +el.dataset.v : el.dataset.v; if(el.dataset.ck==="sleepQ"){ c.sleep=+document.getElementById("sleepR").value; } save(); render(); });
  const r=root.querySelector("#sleepR"); if(r){ r.oninput=()=>{ document.getElementById("sleepLbl").textContent=r.value; }; }
  root.querySelectorAll("[data-rem-toggle]").forEach(el=>el.onclick=()=>{ const x=S.reminders.find(q=>q.id===el.dataset.remToggle); x.on=!x.on; save(); render(); });
  root.querySelectorAll("[data-rem-time]").forEach(el=>el.onchange=()=>{ const x=S.reminders.find(q=>q.id===el.dataset.remTime); if(/^\d{2}:\d{2}$/.test(el.value)) x.time=el.value; save(); render(); });
  root.querySelectorAll("#chatIn,#askIn").forEach(i=>i.onkeydown=(e)=>{ if(e.key==="Enter") act(i.id==="chatIn"?"chatSend":"askSend"); });
}
function act(a,d,el){
  const m=M();
  switch(a){
    case "lang": setLang(EN()?"zh":"en"); break;
    case "setZh": setLang("zh"); break;
    case "setEn": setLang("en"); break;
    case "startChat": openSheet("assess",{mode:"chat"}); break;
    case "startForm": openSheet("assess",{mode:"form"}); break;
    case "toChat": sheet.params={mode:"chat"}; render(); break;
    case "toForm": sheet.params={mode:"form"}; render(); break;
    case "drip": openSheet("drip",{mode:"form"}); break;
    case "dripSkip": toast(tt("明天再问你","We'll ask again tomorrow")); m.checkins[S.day].dripSkipped=true; save(); render(); break;
    case "oneShot": case "continueAll": openSheet("oneShot",{mode:"form"}); break;
    case "ans": setAnswer(m,d.id,+d.v); sheet.params.i++; if(sheet.kind==="assess"&&sheet.params.i>=sheet.params.ids.length) m.screenerDone=true; save(); render(); break;
    case "prev": sheet.params.i=Math.max(0,sheet.params.i-1); render(); break;
    case "chatAns": { const P=sheet.params; if(P.pending){ setAnswer(m,P.pending,+d.v); P.log.push({ai:false,t:LK()[d.v-1]}); P.pending=null; } render(); break; }
    case "chatSend": { const inp=document.getElementById("chatIn"); const t=inp.value.trim(); if(!t) return; const P=sheet.params; P.log.push({ai:false,t}); const hits=mapText(t); if(hits.length){ hits.forEach(([id,v])=>{ if(m.answers[id]==null) setAnswer(m,id,v); }); P.log.push({ai:true,t:tt("明白了。","Got it."),map:tt(`已从你的描述中记录 ${hits.length} 题:${hits.map(h=>itemGist(h[0])).join("、")}`,`Recorded ${hits.length} item${hits.length>1?"s":""} from your description: ${hits.map(h=>itemGist(h[0])).join("; ")}`)}); if(P.pending&&m.answers[P.pending]!=null) P.pending=null; } else if(P.pending){ P.log.push({ai:true,t:tt("我不太确定这对应哪一项。请直接选一个:","I'm not sure which item that matches. Please pick one:")}); } else { P.log.push({ai:true,t:tt("好的,继续。","Okay, let's continue.")}); } render(); break; }
    case "toReport": closeSheet(); if(m.formal) m.formalShown=true; go("constitution"); break;
    case "goals": openSheet("goals"); break;
    case "goal": { const g=d.g; if(m.goals.includes(g)) m.goals=m.goals.filter(x=>x!==g); else if(m.goals.length<2) m.goals.push(g); save(); render(); break; }
    case "genPlan": buildPlan(m); closeSheet(); go("plan"); toast(m.formal?tt("方案已生成","Plan generated"):tt("初版方案已生成","First plan generated")); break;
    case "upgrade": buildPlan(m); m.plan.upgraded=true; m.plan.provisional=false; save(); render(); toast(tt("方案已升级为正式版","Plan upgraded to formal")); break;
    case "goPlan": go("plan"); break;
    case "goConst": go("constitution"); break;
    case "seeFormal": m.formalShown=true; save(); go("constitution"); break;
    case "checkin": push("checkin"); break;
    case "weekly": push("weekly"); break;
    case "back": pop(); break;
    case "recipe": push("recipe"); break;
    case "acu": push("acupoint",{i:+d.i}); break;
    case "didIt": { const c=m.checkins[S.day]||(m.checkins[S.day]={}); c.diet="是"; save(); toast(tt("已计入今日饮食打卡","Counted toward today's diet check-in")); pop(); push("checkin"); break; }
    case "tToggle": if(TIMER.running){ stopTimer(); } else { TIMER.running=true; TIMER.handle=setInterval(tickTimer,1000); } render(); break;
    case "tReset": stopTimer(); TIMER.left=TIMER.total; TIMER.side=1; render(); break;
    case "video": openSheet("video",{}); break;
    case "ask": { const top=S.stack[S.stack.length-1]; const c=m.plan?CT(m.plan.code):null; openSheet("ask",{ctx: top&&top.page==="recipe"&&c? c.recipe.name : top&&top.page==="acupoint"&&c? c.acu[top.params.i].n : null}); break; }
    case "askQ": handleAsk(d.q); break;
    case "askSend": { const inp=document.getElementById("askIn"); const t=inp.value.trim(); if(!t) return; handleAsk(t); break; }
    case "refRecord": { const b=sheet.params.log.find(x=>x.card==="referral"&&!x.resolved); if(b) b.resolved="record"; closeSheet(); S.tab="me"; S.stack=[{page:"clinic",params:{symptom:d.s}}]; save(); render(); break; }
    case "refGeneral": { const b=sheet.params.log.find(x=>x.card==="referral"&&!x.resolved); if(b) b.resolved="general"; sheet.params.log.push({ai:true,t:tt("好的。我们聊养生范围内的内容:饮食、作息、运动、穴位保健。想从哪一项开始?","Sure. Let's stay within wellness: diet, routine, movement, acupressure. Where would you like to start?")}); render(); break; }
    case "family": sheet=null; S.tab="me"; S.stack=[{page:"family"}]; save(); render(); break;
    case "switch": S.cur=d.id; sheet=null; S.stack=[]; save(); render(); toast(tt(`已切换到 ${mn(M())}`,`Switched to ${mn(M())}`)); break;
    case "addMember": openSheet("addMember",{minor:false}); break;
    case "amType": sheet.params.minor=d.v==="1"; sheet.params.name=document.getElementById("amName").value; render(); break;
    case "amSave": { const name=document.getElementById("amName").value.trim()||(sheet.params.minor?tt("孩子","Child"):tt("家人","Family")); S.members.push(mem("m"+Date.now(),name,name[0].toUpperCase(),"f",sheet.params.minor)); save(); const minor=sheet.params.minor; closeSheet(); toast(minor?tt("已创建","Created"):tt("授权邀请已发送(演示中直接加入)","Invitation sent (added directly in the demo)")); render(); break; }
    case "clinic": push("clinic"); break;
    case "settings": push("settings"); break;
    case "history": push("history"); break;
    case "redo": m.answers={}; m.screenerDone=false; m.formal=false; m.formalShown=false; m.plan=null; m.goals=[]; save(); render(); toast(tt("已清除,可重新评估","Cleared — you can reassess")); break;
    case "share": toast(tt("已生成分享图(不含姓名)","Share image created (no name)")); break;
    case "src": openSheet("src",{}); break;
    case "itemSrc": openSheet("src",{item:d.id}); break;
    case "elder": S.elder=!S.elder; save(); render(); break;
    case "export": toast(tt("导出已排队,完成后邮件通知","Export queued; you'll get an email")); break;
    case "del": toast(tt("需二次确认;72 小时内完成(演示)","Needs confirmation; completes within 72 h (demo)")); break;
    case "call": toast(tt("拨打","Calling")+" "+CLINIC.tel+tt("(演示)"," (demo)")); break;
    case "copy": navigator.clipboard&&navigator.clipboard.writeText(CLINIC.tel).then(()=>toast(tt("已复制","Copied")),()=>toast(CLINIC.tel)); break;
    case "closeSheet": closeSheet(); break;
    case "resetDemo": resetAll(); break;
  }
}
function handleAsk(t){
  const P=sheet.params; P.log.push({ai:false,t}); const cls=classify(t);
  if(cls==="emergency"){ sheet={kind:"emergency"}; render(); return; }
  if(cls==="medical"){ P.log.push({card:"referral",symptom:t}); render(); return; }
  if(cls==="off"){ P.log.push({ai:true,t:tt("这个超出了我能帮忙的范围。我只回答中医养生相关的问题。","That's outside what I can help with. I only answer TCM wellness questions.")}); render(); return; }
  const ans=answerWellness(t); P.log.push({ai:true,t:ans.t,src:ans.src}); render();
}
function resetAll(){ const lang=S.lang; S=DEFAULT(); S.lang=lang; sheet=null; save(); render(); toast(tt("已重置","Reset")); }
(function clock(){ const d=new Date(); document.getElementById("clock").textContent=`${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`; setTimeout(clock,30000); })();
render();
</script>
